apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-app
  namespace: analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-app
  template:
    metadata:
      labels:
        app: analytics-app
    spec:
      terminationGracePeriodSeconds: 30
      hostAliases:
        - ip: "172.19.0.1"
          hostnames:
            - "host.docker.internal"
      containers:
        - name: app
          image: ghcr.io/motolipo/highload:latest
          imagePullPolicy: IfNotPresent
          command: ["php", "artisan", "octane:start", "--server=roadrunner", "--host=0.0.0.0", "--port=8080"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: analytics-config
            - secretRef:
                name: analytics-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
