apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: analytics-app
  namespace: analytics
spec:
  ingressClassName: nginx
  rules:
    - host: analytics.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: analytics-app
                port:
                  number: 80