apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-worker
  namespace: analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-worker
  template:
    metadata:
      labels:
        app: analytics-worker
    spec:
      terminationGracePeriodSeconds: 30
      hostAliases:
        - ip: "172.19.0.1"
          hostnames:
            - "host.docker.internal"
      containers:
        - name: app
          image: ghcr.io/motolipo/highload:latest
          imagePullPolicy: IfNotPresent
          command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=300", "--max-jobs=1000"]
          envFrom:
            - configMapRef:
                name: analytics-config
            - secretRef:
                name: analytics-secret
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
